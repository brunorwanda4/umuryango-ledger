[workspace]
resolver = "3"
members = [
    "crates/core-domain",
    "crates/storage-local",
    "crates/i18n",
    "crates/api-client",
    "crates/api-server",
    "crates/wasm-bridge",
    "crates/app-gpui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Umuryango Ledger Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/umuryango/ledger"

[workspace.dependencies]
# Internal workspace crates
umuryango-i18n = { path = "crates/i18n" }
umuryango-core-domain = { path = "crates/core-domain" }
umuryango-storage-local = { path = "crates/storage-local" }
umuryango-api-client = { path = "crates/api-client" }

# Serialization & Common Utilities
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.10", features = ["v4", "serde", "js"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
anyhow = "1.0"
rust_decimal = { version = "1.36", features = ["serde"] }
dashmap = "6.1"
semver = { version = "1.0", features = ["serde"] }
getrandom = { version = "0.2", features = ["js"] }

# Security & Cryptography
argon2 = "0.5"
jsonwebtoken = "9.3"
rand = "0.8"
sha2 = "0.10"

# Configuration
dotenvy = "0.15"

# Async & Networking
tokio = { version = "1.40", features = ["full"] }
async-trait = "0.1"
futures = "0.3"
futures-util = "0.3"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }

# Backend Web & Database
actix-web = "4.9"
actix-cors = "0.7"
actix-ws = "0.3"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "rust_decimal", "migrate", "macros"] }

# Storage & Embedded
rusqlite = { version = "0.32", features = ["bundled", "uuid", "chrono"] }
tempfile = "3.12"

# Self-Update & Releases
self-replace = "1.5"
self_update = { version = "0.41", default-features = false, features = ["rustls", "archive-zip", "archive-tar", "compression-zip-deflate", "compression-flate2"] }

# WASM
wasm-bindgen = "0.2"

# Localization
fluent-bundle = "0.15"
unic-langid = "0.9"

# Logging & Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-actix-web = "0.7"

# OpenAPI & Swagger UI
utoipa = { version = "6.0", features = ["macros"] }
utoipa-swagger-ui = { version = "10.0", features = ["actix-web"] }
